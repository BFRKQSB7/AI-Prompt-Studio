const NEG_DEFAULT = ['blurry','low quality','worst quality','distorted face','deformed hands','extra fingers','bad anatomy','oversaturated','cartoon','anime','illustration','3d render','watermark','text'];

/* ============ 状态 ============ */
let activeSlot = 0, activeSub = '';
let sel = new Map();            // slotIndex -> [{en,zh,w}]
let favSet = new Set(JSON.parse(localStorage.getItem('nlp_fav')||'[]'));
let favOnly = false;
let weightTarget = null;
const $ = id => document.getElementById(id);
const NEG_IDX = 8;

/* ============ 拼装 ============ */
function fmtPhrase(p){ return p.w ? `(${p.en}:${p.w})` : p.en; }
function assemble(){
  const parts=[];
  SLOTS.forEach((slot,i)=>{
    if(i===NEG_IDX) return;
    (sel.get(i)||[]).forEach(p=>parts.push(fmtPhrase(p)));
  });
  return parts.join(', ');
}
function assembleNeg(){
  const parts=(sel.get(NEG_IDX)||[]).map(p=>fmtPhrase(p));
  const extra=$('negExtra').value.trim();
  if(extra) parts.push(extra);
  return parts.join(', ');
}

/* ============ 渲染 ============ */
function renderSlotNav(){
  document.querySelectorAll('#slotNav button').forEach(b=>{
    b.classList.toggle('active', +b.dataset.i===activeSlot);
  });
}
function renderSlotHead(){
  const s=SLOTS[activeSlot];
  $('slotTitle').textContent = s.name;
  $('slotHint').textContent = (activeSlot===NEG_IDX) ? '可多选 · 点选加入负面词' : (s.multi?'可多选 · 点选加入 / 再点取消':'单选 · 点选即替换');
}
function renderSubbar(){
  const s=SLOTS[activeSlot];
  const bar=$('subbar');
  bar.innerHTML='<button class="'+(activeSub===''?'active':'')+'" data-s="">全部</button>'+s.subs.map(sub=>`<button class="${activeSub===sub?'active':''}" data-s="${sub}">${sub}</button>`).join('');
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{ activeSub=b.dataset.s; renderSubbar(); renderPhrases(); });
}
function renderPhrases(){
  const s=SLOTS[activeSlot];
  const grid=$('phraseGrid');
  const pool = activeSub ? s.phrases.filter(p=>p[2]===activeSub) : s.phrases;
  if(favOnly){ const keep=pool.filter(([en])=>favSet.has(en)); grid.innerHTML = keep.length? '' : '<span class="empty">该分类暂无收藏，点 ★ 收藏短语后可「仅看收藏」</span>'; }
  grid.innerHTML='';
  pool.forEach(([en,zh])=>{
    if(favOnly && !favSet.has(en)) return;
    const arr=sel.get(activeSlot)||[];
    const isSel=arr.some(p=>p.en===en);
    const isFav=favSet.has(en);
    const ph=arr.find(p=>p.en===en);
    const cls=(activeSlot===NEG_IDX)?(isSel?'phrase neg-sel':'phrase'):(isSel?'phrase sel':'phrase');
    const d=document.createElement('button');
    d.className=cls+(isFav?' faved':'');
    d.innerHTML=`<span class="en">${en}</span><span class="zh">${zh}</span><span class="wgt">${ph&&ph.w?('权重 '+ph.w):''}</span><span class="fav-star">${isFav?'★':'☆'}</span>`;
    d.onclick=()=>toggleSelect(en,zh);
    d.oncontextmenu=e=>{ e.preventDefault(); openWeight(activeSlot,en); };
    d.querySelector('.fav-star').onclick=e=>{ e.stopPropagation(); toggleFav(en); };
    grid.appendChild(d);
  });
}
function toggleSelect(en,zh){
  const s=SLOTS[activeSlot];
  let arr=sel.get(activeSlot)||[];
  const idx=arr.findIndex(p=>p.en===en);
  if(idx>=0){ arr.splice(idx,1); }
  else { if(!s.multi) arr=[]; arr.push({en,zh,w:null}); }
  if(arr.length) sel.set(activeSlot,arr); else sel.delete(activeSlot);
  refresh();
}
function toggleFav(en){
  if(favSet.has(en)) favSet.delete(en); else favSet.add(en);
  localStorage.setItem('nlp_fav', JSON.stringify([...favSet]));
  renderPhrases();
}

function renderPreview(){
  const posBox=$('posBox'), negBox=$('negBox');
  // 正面
  const posParts=[];
  SLOTS.forEach((slot,i)=>{ if(i===NEG_IDX) return; (sel.get(i)||[]).forEach(p=>posParts.push({slot:i,...p})); });
  posBox.innerHTML = posParts.length ? '' : '<span class="empty">在右侧选短语，会自动拼成一句自然语言提示词…</span>';
  posParts.forEach(p=>posBox.appendChild(chipEl(p,'pos')));
  // 负面
  const negParts=(sel.get(NEG_IDX)||[]).map(p=>({slot:NEG_IDX,...p}));
  negBox.innerHTML = negParts.length ? '' : '<span class="empty">在「⑨ 负面词」槽位点选，可拖动排序</span>';
  negParts.forEach(p=>negBox.appendChild(chipEl(p,'neg')));
}
function chipEl(p,kind){
  const c=document.createElement('span');
  c.className='chip '+kind; c.draggable=true;
  c.innerHTML=`${fmtPhrase(p)}<span class="x" title="删除">×</span>${p.w?'<span class="w" title="右键改权重">'+p.w+'</span>':''}`;
  c.querySelector('.x').onclick=()=>removePart(p.slot,p.en);
  c.oncontextmenu=e=>{ e.preventDefault(); openWeight(p.slot,p.en); };
  return c;
}
function removePart(slotIdx,en){
  let arr=sel.get(slotIdx)||[];
  arr=arr.filter(p=>p.en!==en);
  if(arr.length) sel.set(slotIdx,arr); else sel.delete(slotIdx);
  refresh();
}
function refresh(){ renderPreview(); renderPhrases(); }

/* ============ 权重 ============ */
function openWeight(slotIdx,en){
  const arr=sel.get(slotIdx)||[];
  const p=arr.find(x=>x.en===en);
  if(!p) return;
  weightTarget={slotIdx,en};
  $('wInput').value=p.w||'1.2';
  const pop=$('weightPop'); pop.classList.add('show');
  const r=$('posBox').getBoundingClientRect();
  pop.style.left=(r.left+40)+'px'; pop.style.top=(r.top+r.height+8)+'px';
}
function closeWeight(){ $('weightPop').classList.remove('show'); weightTarget=null; }
function setWeight(v){
  if(!weightTarget) return;
  const {slotIdx,en}=weightTarget;
  const arr=sel.get(slotIdx)||[];
  const p=arr.find(x=>x.en===en);
  if(p) p.w=(v===1||!v)?null:Math.round(v*10)/10;
  refresh();
}
$('wInc').onclick=()=>{ const v=(parseFloat($('wInput').value)||1)+0.1; $('wInput').value=v; setWeight(v); };
$('wDec').onclick=()=>{ const v=(parseFloat($('wInput').value)||1)-0.1; $('wInput').value=v; setWeight(v); };
$('wReset').onclick=()=>{ $('wInput').value='1'; setWeight(1); };
$('wClose').onclick=closeWeight;
$('wInput').addEventListener('change',()=>{ setWeight(parseFloat($('wInput').value)||1); });
document.addEventListener('click',e=>{ if(!e.target.closest('#weightPop')) closeWeight(); });

/* ============ 动作 ============ */
$('randBtn').onclick=()=>{
  sel.clear();
  SLOTS.forEach((slot,i)=>{
    let pool=favOnly?slot.phrases.filter(([en])=>favSet.has(en)):slot.phrases;
    if(!pool.length) pool=slot.phrases;
    const [en,zh]=pool[Math.floor(Math.random()*pool.length)];
    sel.set(i,[{en,zh,w:null}]);
  });
  refresh();
};
$('favOnlyBtn').onclick=()=>{ favOnly=!favOnly; $('favOnlyBtn').classList.toggle('btn-fav-on',favOnly); renderPhrases(); };
$('clearBtn').onclick=()=>{ sel.clear(); refresh(); };
$('copyPosBtn').onclick=async()=>{
  const t=assemble();
  if(!t){ flash('先选几个短语'); return; }
  const ok=await copyText(t);
  flash(ok?'✅ 正面已复制':'已弹出文本框，请手动复制（Ctrl+C）');
};
$('copyNegBtn').onclick=async()=>{
  const t=assembleNeg();
  if(!t){ flash('负面为空'); return; }
  const ok=await copyText(t);
  flash(ok?'✅ 负面已复制':'已弹出文本框，请手动复制（Ctrl+C）');
};
async function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  }
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok) return true;
  }catch(e){}
  showCopyModal(text);
  return false;
}
function showCopyModal(text){
  let m=document.getElementById('copyModal');
  if(!m){
    m=document.createElement('div'); m.id='copyModal';
    m.innerHTML='<div class="cm-box"><div class="cm-head">复制提示词（Ctrl+C）<button class="cm-close">✕</button></div><textarea class="cm-text"></textarea></div>';
    document.body.appendChild(m);
    m.querySelector('.cm-close').onclick=()=>m.remove();
    m.addEventListener('click',e=>{ if(e.target===m) m.remove(); });
  }
  m.querySelector('.cm-text').value=text;
  m.classList.add('show');
  const ta=m.querySelector('.cm-text'); ta.focus(); ta.select();
}

/* ============ 预设 ============ */
$('savePresetBtn').onclick=()=>{
  const flat=[];
  SLOTS.forEach((slot,i)=>(sel.get(i)||[]).forEach(p=>flat.push({i,en:p.en,zh:p.zh,w:p.w})));
  if(!flat.length){ flash('先选几个短语再存'); return; }
  const name=prompt('预设名称：','组合 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
  if(!name) return;
  const presets=JSON.parse(localStorage.getItem('nlp_presets')||'{}');
  presets[name]=flat;
  localStorage.setItem('nlp_presets',JSON.stringify(presets));
  renderPresets(name);
  flash('✅ 已保存预设');
};
$('presetSel').onchange=()=>{
  const name=$('presetSel').value; if(!name) return;
  const presets=JSON.parse(localStorage.getItem('nlp_presets')||'{}');
  const flat=presets[name]; if(!flat) return;
  sel.clear();
  flat.forEach(p=>{ const arr=sel.get(p.i)||[]; arr.push({en:p.en,zh:p.zh,w:p.w}); sel.set(p.i,arr); });
  refresh();
};
$('delPresetBtn').onclick=()=>{
  const name=$('presetSel').value;
  if(!name){ flash('先在预设下拉里选中要删的预设'); return; }
  const presets=JSON.parse(localStorage.getItem('nlp_presets')||'{}');
  delete presets[name];
  localStorage.setItem('nlp_presets',JSON.stringify(presets));
  renderPresets();
  flash('✅ 已删除预设「'+name+'」');
};
function renderPresets(selName){
  const presets=JSON.parse(localStorage.getItem('nlp_presets')||'{}');
  $('presetSel').innerHTML='<option value="">预设</option>'+Object.keys(presets).map(n=>`<option ${n===selName?'selected':''}>${n}</option>`).join('');
}
function flash(msg){
  const old=$('flashMsg'); if(old) old.remove();
  const s=document.createElement('div');
  s.id='flashMsg'; s.textContent=msg;
  s.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:.5rem 1rem;border-radius:8px;z-index:300;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3)';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),1500);
}

/* ============ 槽位 / 主题 ============ */
document.querySelectorAll('#slotNav button').forEach(b=>{
  b.onclick=()=>{ activeSlot=+b.dataset.i; activeSub=''; renderSlotNav(); renderSlotHead(); renderSubbar(); renderPhrases(); };
});
$('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
};
$('negExtra').addEventListener('input',()=>{ /* 额外负面实时生效于 assembleNeg */ });

/* ============ 启动：预选默认负面词 ============ */
NEG_DEFAULT.forEach(en=>{
  const ph=SLOTS[NEG_IDX].phrases.find(p=>p[0]===en);
  if(ph){
    const arr=sel.get(NEG_IDX)||[];
    if(!arr.some(p=>p.en===en)) arr.push({en:ph[0],zh:ph[1],w:null});
    sel.set(NEG_IDX,arr);
  }
});
renderPresets();
renderSlotNav();
renderSlotHead();
renderSubbar();
refresh();
})();
</script>
