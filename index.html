function ensureModelOption(v){
  const sel=$('modelName');
  if(!v) return;
  if(![...sel.options].some(o=>o.value===v)){ const o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o); }
  sel.value=v;
}
function applyCfg(){
  $('provider').value=cfg.provider;
  $('baseUrl').value=cfg.base||PROVIDERS[cfg.provider].base;
  ensureModelOption(cfg.model||PROVIDERS[cfg.provider].model);
  $('apiKey').value=cfg.key||'';
  if(cfg.provider==='local') loadModels();
}
function saveCfg(){
  cfg={provider:$('provider').value,base:$('baseUrl').value.trim(),model:$('modelName').value.trim(),key:$('apiKey').value.trim()};
  localStorage.setItem(LS,JSON.stringify(cfg));
}
async function loadModels(){
  const base=$('baseUrl').value.trim().replace(/\/+$/,'');
  const key=$('apiKey').value.trim();
  const sel=$('modelName');
  if(!base){ sel.innerHTML='<option value="">（先填 Base URL）</option>'; return; }
  sel.innerHTML='<option value="">（加载中…）</option>';
  try{
    const headers={}; if(key) headers['Authorization']='Bearer '+key;
    const r=await fetch(base+'/models',{headers,signal:AbortSignal.timeout(8000)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    let ids=(d.data||[]).map(m=>m.id).filter(Boolean);
    if($('provider').value==='local') ids=ids.map(id=>id.replace(/^models\//,'').split(/[\\/]/).pop());
    if($('provider').value==='openai') ids=ids.filter(id=>!/embedding|whisper|audio|tts|davinci|realtime|moderation|rerank/i.test(id));

  }catch(e){
    sel.innerHTML='<option value="">（加载失败：'+e.message+'）</option>';
  }
}
$('provider').addEventListener('change',()=>{
  const p=$('provider').value;

  if(p==='local'){ $('modelName').innerHTML='<option value="">（点击载入模型列表）</option>'; loadModels(); }

  saveCfg();
});
$('baseUrl').addEventListener('change',saveCfg);
