<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写实提示词生成器 v1.0.1</title>
<style>
  :root, html[data-theme="dark"]{
    --bg:#0e131f; --card:#151d2e; --card2:#0a0f1a; --border:#26324a;
    --text:#e2e8f0; --text2:#8b9bb4; --text3:#64748b;
    --accent:#4f8ef7; --accent-soft:rgba(79,142,247,.14);
    --pos:#2dd4bf; --pos-soft:rgba(45,212,191,.14); --neg:#f87171; --neg-soft:rgba(248,113,113,.14);
    --fav:#f5b942; --fav-soft:rgba(245,185,66,.16);
    --radius:10px; --radius-sm:6px;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  html[data-theme="light"]{
    --bg:#f7f5f2; --card:#ffffff; --card2:#efece7; --border:#e5e1da;
    --text:#1e293b; --text2:#475569; --text3:#64748b;
    --accent:#4f8ef7; --accent-soft:rgba(79,142,247,.14);
    --pos:#2dd4bf; --pos-soft:rgba(45,212,191,.14); --neg:#f87171; --neg-soft:rgba(248,113,113,.14);
    --fav:#f5b942; --fav-soft:rgba(245,185,66,.16);
    --radius:10px; --radius-sm:6px;
    --shadow:0 1px 2px rgba(15,23,42,.08);
  }
  @media (prefers-color-scheme: dark){ :root{ color-scheme:dark; } }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:var(--radius-sm);padding:.35rem .7rem;font-size:13px}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.4;cursor:not-allowed}
  code{font-family:Consolas,"JetBrains Mono",monospace;font-size:.9em}

  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.6rem 1rem;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .topbar h1{font-size:1.05rem;margin:0;white-space:nowrap}
  .topbar .sub{color:var(--text3);font-size:12px;margin-right:.4rem}
  .spacer{flex:1}
  .btn-pos{background:var(--pos-soft);color:var(--pos);border-color:var(--pos)}
  .btn-neg{background:var(--neg-soft);color:var(--neg);border-color:var(--neg)}
  .btn-fav-on{background:var(--fav-soft);color:var(--fav);border-color:var(--fav)}
  .toolbar select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.35rem .4rem;font-size:13px}

  .layout{display:flex;gap:1rem;max-width:1100px;margin:0 auto;padding:1rem}
  aside{width:150px;flex:none;display:flex;flex-direction:column;gap:.35rem}
  aside button{text-align:left;padding:.5rem .7rem;font-size:13px}
  aside button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1rem}

  .preview{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.8rem 1rem}
  .preview .label{font-size:12px;color:var(--text3);margin-bottom:.4rem}
  .preview .pos-box{min-height:60px;padding:.6rem .8rem;background:var(--card2);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
  .preview .empty{color:var(--text3);font-size:13px}
  .chip{display:inline-flex;align-items:center;gap:.35rem;padding:.15rem .4rem .15rem .55rem;border-radius:6px;font-size:13px;cursor:grab;user-select:none}
  .chip.pos{background:var(--pos-soft);color:var(--pos);border:1px solid var(--pos)}
  .chip .en{color:var(--text)}
  .chip .w{font-size:11px;background:var(--fav);color:#111;border-radius:4px;padding:0 .3rem;cursor:pointer}
  .chip .x{opacity:.5;cursor:pointer;font-weight:700}
  .chip .x:hover{opacity:1}
  .chip.dragging{opacity:.5}
  .neg-row{margin-top:.6rem;display:flex;align-items:center;gap:.5rem}
  .neg-row textarea{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:.5rem .7rem;font-size:13px;resize:vertical;min-height:44px;font-family:inherit}

  .slot-head{display:flex;align-items:baseline;gap:.6rem}
  .slot-head h2{font-size:1rem;margin:0;color:var(--accent)}
  .slot-head .hint{font-size:12px;color:var(--text3)}
  .phrases{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem}
  .phrase{position:relative;text-align:left;padding:.55rem .7rem;font-size:13px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;gap:.1rem;align-items:flex-start}
  .phrase:hover{border-color:var(--accent)}
  .phrase .en{color:var(--accent);font-weight:600}
  .phrase .zh{color:var(--text3);font-size:12px}
  .phrase.sel{background:var(--pos-soft);border-color:var(--pos)}
  .phrase.sel .en{color:var(--pos)}
  .phrase .fav-star{position:absolute;top:.3rem;right:.4rem;font-size:13px;color:var(--text3);cursor:pointer}
  .phrase.faved .fav-star{color:var(--fav)}
  .phrase .wgt{font-size:11px;color:var(--text3)}

  .weight-pop{position:fixed;z-index:200;background:var(--card);border:1px solid var(--accent);border-radius:var(--radius);padding:.7rem;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;min-width:190px}
  .weight-pop.show{display:block}
  .weight-pop .row{display:flex;align-items:center;gap:.35rem;margin:.3rem 0}
  .weight-pop input{width:70px;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:.25rem .4rem;text-align:center}
  .weight-pop .tiny{padding:.2rem .4rem;font-size:12px}

  #copyModal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:1rem}
  #copyModal.show{display:flex}
  #copyModal .cm-box{background:var(--card);border:1px solid var(--accent);border-radius:var(--radius);padding:.8rem;width:min(620px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #copyModal .cm-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--accent);margin-bottom:.5rem}
  #copyModal .cm-close{background:none;border:none;color:var(--text2);font-size:14px;padding:.2rem .4rem}
  #copyModal .cm-text{width:100%;min-height:110px;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:.6rem .7rem;font-size:13px;resize:vertical;font-family:inherit}

  footer{padding:1rem;text-align:center;color:var(--text3);font-size:12px}
  @media (max-width:760px){ .layout{flex-direction:column} aside{width:100%;flex-direction:row;flex-wrap:wrap} aside button{flex:1;text-align:center} }
</style>
</head>
<body>

<div class="topbar">
  <h1>🎨 写实提示词生成器 v1.0.1</h1>
  <span class="sub">自然语言 · 适配 RealVis / Juggernaut 写实模型</span>
  <div class="spacer"></div>
  <select id="presetSel"><option value="">预设</option></select>
  <button id="savePresetBtn" title="保存当前组合为预设">💾 存预设</button>
  <button id="delPresetBtn" title="删除当前选中的预设">🗑 删预设</button>
  <button id="randBtn" title="每个槽位随机抽一条">🎲 灵感随机</button>
  <button id="favOnlyBtn" title="只看已收藏短语">★ 仅看收藏</button>
  <button id="themeBtn" title="切换深浅色">🌓</button>
  <button id="clearBtn">清空</button>
  <button class="btn-pos" id="copyPosBtn">📋 复制正面</button>
  <button class="btn-neg" id="copyNegBtn">📋 复制负面</button>
</div>

<div class="layout">
  <aside id="slotNav">
    <button data-i="0" class="active">① 质量词</button>
    <button data-i="1">② 主体</button>
    <button data-i="2">③ 外貌细节</button>
    <button data-i="3">④ 动作 / 姿势</button>
    <button data-i="4">⑤ 服饰</button>
    <button data-i="5">⑥ 场景 / 环境</button>
    <button data-i="6">⑦ 光线</button>
    <button data-i="7">⑧ 镜头 / 风格</button>
  </aside>

  <main>
    <div class="preview">
      <div class="label">正面提示词（点胶囊 × 删除，可拖动排序）</div>
      <div class="pos-box" id="posBox"><span class="empty">在右侧选短语，会自动拼成一句自然语言提示词…</span></div>
      <div class="neg-row">
        <span class="label">负面</span>
        <textarea id="negBox">blurry, low quality, worst quality, distorted face, deformed hands, extra fingers, bad anatomy, oversaturated, cartoon, anime, illustration, 3d render, watermark, text</textarea>
      </div>
    </div>

    <div class="slot-head">
      <h2 id="slotTitle">质量词</h2>
      <span class="hint" id="slotHint">可多选</span>
    </div>
    <div class="phrases" id="phraseGrid"></div>
  </main>
</div>

<div class="weight-pop" id="weightPop">
  <div class="row"><b>权重</b> <input id="wInput" value="1.2"> <button class="tiny" id="wDec">−</button> <button class="tiny" id="wInc">+</button></div>
  <div class="row"><button id="wReset">重置为 1</button> <button id="wClose" style="margin-left:auto">完成</button></div>
</div>

<footer>写实提示词生成器 v1.0.1 · 单文件离线可用 · 槽位式自然语言拼装</footer>

function fmtPhrase(p){
  return p.w ? `(${p.en}:${p.w})` : p.en;

function assemble(){
  const parts=[];
  SLOTS.forEach((slot,i)=>{
    const arr = sel.get(i)||[];

}
function renderSlotTitle(){
  const s=SLOTS[activeSlot];
  $('slotTitle').textContent = s.name;
  $('slotHint').textContent = s.multi ? '可多选 · 点选加入 / 再点取消' : '单选 · 点选即替换';
}
function renderPhrases(){
  const s=SLOTS[activeSlot];
  const grid=$('phraseGrid');
  grid.innerHTML='';
  s.phrases.forEach(([en,zh])=>{
    const arr=sel.get(activeSlot)||[];
    const isSel=arr.some(p=>p.en===en);
    const isFav=favSet.has(en);
    const ph=arr.find(p=>p.en===en);
    const d=document.createElement('button');
    d.className='phrase'+(isSel?' sel':'')+(isFav?' faved':'');
    d.innerHTML=`<span class="en">${en}</span><span class="zh">${zh}</span><span class="wgt">${ph&&ph.w?('权重 '+ph.w):''}</span><span class="fav-star">${isFav?'★':'☆'}</span>`;
    d.onclick=()=>{ toggleSelect(en,zh); };
    d.oncontextmenu=e=>{ e.preventDefault(); openWeight(activeSlot,en); };
    d.querySelector('.fav-star').onclick=e=>{ e.stopPropagation(); toggleFav(en); };
    grid.appendChild(d);
  });
}
function toggleSelect(en,zh){
  const s=SLOTS[activeSlot];
  let arr=sel.get(activeSlot)||[];
  const idx=arr.findIndex(p=>p.en===en);
  if(idx>=0){
    arr.splice(idx,1);
  }else{
    if(!s.multi) arr=[];
    arr.push({en,zh,w:null});
  }
  if(arr.length) sel.set(activeSlot,arr); else sel.delete(activeSlot);
  refresh();
}
function toggleFav(en){
  if(favSet.has(en)) favSet.delete(en); else favSet.add(en);
  localStorage.setItem('nlp_fav', JSON.stringify([...favSet]));
  renderPhrases();
}

/* 预览胶囊 */
function renderPreview(){
  const box=$('posBox');
  const parts=[];
  SLOTS.forEach((slot,i)=>{
    (sel.get(i)||[]).forEach(p=>parts.push({slot:i, ...p}));
  });
  if(!parts.length){ box.innerHTML='<span class="empty">在右侧选短语，会自动拼成一句自然语言提示词…</span>'; return; }
  box.innerHTML='';
  parts.forEach((p)=>{
    const c=document.createElement('span');
    c.className='chip pos'; c.draggable=true;
    c.innerHTML=`${fmtPhrase(p)}<span class="x" title="删除">×</span>${p.w?'<span class="w" title="点右键改权重">'+p.w+'</span>':''}`;
    c.querySelector('.x').onclick=()=>{ removePart(p.slot,p.en); };
    c.oncontextmenu=e=>{ e.preventDefault(); openWeight(p.slot,p.en); };
    c.addEventListener('dragstart',ev=>{ ev.dataTransfer.setData('text/plain',String(parts.indexOf(p))); c.classList.add('dragging'); });
    c.addEventListener('dragend',()=>c.classList.remove('dragging'));
    c.addEventListener('dragover',ev=>{ ev.preventDefault(); ev.dataTransfer.dropEffect='move'; });
    c.addEventListener('drop',ev=>{
      ev.preventDefault();
      const from=+ev.dataTransfer.getData('text/plain');
      const to=parts.indexOf(p);
      reorder(from,to);
    });
    box.appendChild(c);
  });
}
function removePart(slotIdx,en){
  let arr=sel.get(slotIdx)||[];
  arr=arr.filter(p=>p.en!==en);
  if(arr.length) sel.set(slotIdx,arr); else sel.delete(slotIdx);
  refresh();
}
function reorder(from,to){
  // 重建有序 parts，交换两个槽位短语的相对位置
  const flat=[];
  SLOTS.forEach((slot,i)=>(sel.get(i)||[]).forEach(p=>flat.push({i,...p})));
  if(from<0||from>=flat.length||to<0||to>=flat.length||from===to) return;
  const [m]=flat.splice(from,1); flat.splice(to,0,m);
  sel.clear();
  flat.forEach(p=>{ const arr=sel.get(p.i)||[]; arr.push({en:p.en,zh:p.zh,w:p.w}); sel.set(p.i,arr); });
  refresh();
}
function refresh(){
  renderPreview();
  renderPhrases();
}

/* ============ 权重 ============ */
function openWeight(slotIdx,en){
  const arr=sel.get(slotIdx)||[];
  const p=arr.find(x=>x.en===en);
  if(!p) return;
  weightTarget={slotIdx,en};
  $('wInput').value=p.w||'1.2';
  const pop=$('weightPop');
  pop.classList.add('show');
  const rect=$('posBox').getBoundingClientRect();
  pop.style.left=(rect.left+40)+'px'; pop.style.top=(rect.top+rect.height+8)+'px';
}
function closeWeight(){ $('weightPop').classList.remove('show'); weightTarget=null; }
function setWeight(v){
  if(!weightTarget) return;
  const {slotIdx,en}=weightTarget;
  const arr=sel.get(slotIdx)||[];
  const p=arr.find(x=>x.en===en);
  if(p){ p.w=(v===1||!v)?null:Math.round(v*10)/10; }
  refresh();
}
$('wInc').onclick=()=>{ const v=(parseFloat($('wInput').value)||1)+0.1; $('wInput').value=v; setWeight(v); };
$('wDec').onclick=()=>{ const v=(parseFloat($('wInput').value)||1)-0.1; $('wInput').value=v; setWeight(v); };
$('wReset').onclick=()=>{ $('wInput').value='1'; setWeight(1); };
$('wClose').onclick=closeWeight;
$('wInput').addEventListener('change',()=>{ const v=parseFloat($('wInput').value)||1; setWeight(v); });
document.addEventListener('click',e=>{ if(!e.target.closest('#weightPop')) closeWeight(); });

/* ============ 动作 ============ */
$('randBtn').onclick=()=>{
  sel.clear();
  SLOTS.forEach((slot,i)=>{
    let pool=favOnly?slot.phrases.filter(([en])=>favSet.has(en)):slot.phrases;
    if(!pool.length) pool=slot.phrases;
    const [en,zh]=pool[Math.floor(Math.random()*pool.length)];
    sel.set(i,[{en,zh,w:null}]);
  });
  refresh();
};
$('favOnlyBtn').onclick=()=>{ favOnly=!favOnly; $('favOnlyBtn').classList.toggle('btn-fav-on',favOnly); renderPhrases(); };
$('clearBtn').onclick=()=>{ sel.clear(); refresh(); };
$('copyPosBtn').onclick=async()=>{
  const t=assemble();
  if(!t){ flash('先选几个短语'); return; }
  const ok=await copyText(t);
  flash(ok?'✅ 正面已复制':'已弹出文本框，请手动复制（Ctrl+C）');
};
$('copyNegBtn').onclick=async()=>{
  const t=$('negBox').value.trim();
  if(!t){ flash('负面为空'); return; }
  const ok=await copyText(t);
  flash(ok?'✅ 负面已复制':'已弹出文本框，请手动复制（Ctrl+C）');
};

/* 复制三级兜底：clipboard → execCommand → 弹层手动复制 */
async function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  }
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok) return true;
  }catch(e){}
  showCopyModal(text);
  return false;
}
function showCopyModal(text){
  let m=document.getElementById('copyModal');
  if(!m){
    m=document.createElement('div');
    m.id='copyModal';
    m.innerHTML='<div class="cm-box"><div class="cm-head">复制提示词（Ctrl+C）<button class="cm-close">✕</button></div><textarea class="cm-text"></textarea></div>';
    document.body.appendChild(m);
    m.querySelector('.cm-close').onclick=()=>m.remove();
    m.addEventListener('click',e=>{ if(e.target===m) m.remove(); });
  }
  m.querySelector('.cm-text').value=text;
  m.classList.add('show');
  const ta=m.querySelector('.cm-text'); ta.focus(); ta.select();
}

/* 预设 */
$('savePresetBtn').onclick=()=>{
  const flat=[];
  SLOTS.forEach((slot,i)=>(sel.get(i)||[]).forEach(p=>flat.push({i,en:p.en,zh:p.zh,w:p.w})));
  if(!flat.length){ flash('先选几个短语再存'); return; }
  const name=prompt('预设名称：','组合 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
  if(!name) return;
  const presets=JSON.parse(localStorage.getItem('nlp_presets')||'{}');
  presets[name]=flat;
  localStorage.setItem('nlp_presets',JSON.stringify(presets));
  renderPresets(name);
  flash('✅ 已保存预设');
};
$('presetSel').onchange=()=>{
  const name=$('presetSel').value;
  if(!name) return;
  const presets=JSON.parse(localStorage.getItem('nlp_presets')||'{}');
  const flat=presets[name];
  if(!flat) return;
  sel.clear();
  flat.forEach(p=>{ const arr=sel.get(p.i)||[]; arr.push({en:p.en,zh:p.zh,w:p.w}); sel.set(p.i,arr); });
  refresh();
};
$('delPresetBtn').onclick=()=>{
  const name=$('presetSel').value;
  if(!name){ flash('先在预设下拉里选中要删的预设'); return; }
  const presets=JSON.parse(localStorage.getItem('nlp_presets')||'{}');
  delete presets[name];
  localStorage.setItem('nlp_presets',JSON.stringify(presets));
  renderPresets();
  flash('✅ 已删除预设「'+name+'」');
};
function renderPresets(selName){
  const presets=JSON.parse(localStorage.getItem('nlp_presets')||'{}');
  const selEl=$('presetSel');
  selEl.innerHTML='<option value="">预设</option>'+Object.keys(presets).map(n=>`<option ${n===selName?'selected':''}>${n}</option>`).join('');
}
function flash(msg){
  const old=$('flashMsg'); if(old) old.remove();
  const s=document.createElement('div');
  s.id='flashMsg'; s.textContent=msg;
  s.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:.5rem 1rem;border-radius:8px;z-index:300;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3)';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),1500);
}

/* 槽位切换 */
document.querySelectorAll('#slotNav button').forEach(b=>{
  b.onclick=()=>{ activeSlot=+b.dataset.i; renderSlotNav(); renderSlotTitle(); renderPhrases(); };
});

/* 深色模式 */
$('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
};

/* 启动 */
renderPresets();
renderSlotNav();
renderSlotTitle();
refresh();
})();
</script>
